# Copy this file into the *managed* repository as:
#   .github/workflows/cursor-branch-sync.yml
#
# Requires a GitHub Actions self-hosted runner on the same Windows machine
# that holds the local clone (REPO_PATH). No inbound ports or tunnel needed.
#
# Edit working-directory below to the absolute path of your cursor-helper install.

name: Cursor Branch Sync

on:
  create:
  delete:
  push:
  pull_request:
    types: [opened, ready_for_review, reopened, closed]

permissions:
  contents: write
  pull-requests: read

jobs:
  sync:
    runs-on: [self-hosted, Windows]
    steps:
      - name: Forward event to local branch sync
        working-directory: C:\Users\Samisu\Documents\GitHub\cursor-helper
        shell: cmd
        run: node src\cli.js
